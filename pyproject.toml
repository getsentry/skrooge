[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[project]
name = "skrooge"
version = "2.0.0"
description = "A quick and dirty kubernetes cost estimator"
readme = "README.md"
authors = [{name = "Michael Warkentin"}]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "click>=8.2",
    "click-log>=0.4",
    "textual>=8.2.8",
]

[project.urls]
Homepage = "https://github.com/getsentry/skrooge"
Changelog = "https://github.com/getsentry/skrooge/releases"
Issues = "https://github.com/getsentry/skrooge/issues"
CI = "https://github.com/getsentry/skrooge/actions"

[project.scripts]
skrooge = "skrooge.cli:cli"

[dependency-groups]
dev = [
    "cogapp>=3.6",
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "ruff>=0.17",
]

[tool.uv.build-backend]
module-root = ""

[tool.ruff.lint]
extend-select = ["B", "C4", "I", "UP"]

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["skrooge"]
