# This workflow lints, tests across all supported Python versions, and checks that the package builds and runs
# For more information see: https://docs.astral.sh/uv/guides/integration/github/

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
    - name: Install dependencies
      run: uv sync --locked
    - name: Lint with ruff
      run: uv run --frozen ruff check --output-format=github .
    - name: Check formatting with ruff
      run: uv run --frozen ruff format --check .
    - name: Check the CLI help in README.md is up to date
      run: uv run --frozen cog --check --diff --check-fail-msg='run "uv run cog -r README.md"' README.md

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up uv and Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: uv sync --locked
    - name: Test with pytest
      run: uv run --frozen pytest --cov --cov-report=xml
    - name: Upload to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

  package:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
    - name: Build
      run: uv build
    - name: Smoke test the built wheel
      run: |
        uvx --isolated --from dist/skrooge-*.whl skrooge --version
        uvx --isolated --from dist/skrooge-*.whl skrooge estimate --instance n2-standard-32 --replicas 30 --cpu 2500 --mem 2024
