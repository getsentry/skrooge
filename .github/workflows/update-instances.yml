# Regenerates skrooge/instances.json from the Cloud Billing Catalog API and opens or
# updates a single pull request when it changes. It never pushes to main.
#
# Needs one of:
# - Workload identity federation: the GCP_WORKLOAD_IDENTITY_PROVIDER and
#   GCP_SERVICE_ACCOUNT variables, for a provider that trusts this repository and a
#   service account it can impersonate. The service account's project needs the Cloud
#   Billing API enabled. No key is stored.
# - The GCP_BILLING_API_KEY secret: an API key restricted to the Cloud Billing API.
# And:
# - The Sentry release bot GitHub App (SENTRY_RELEASE_BOT_CLIENT_ID variable and
#   SENTRY_RELEASE_BOT_PRIVATE_KEY secret, as release.yml uses) with contents and pull
#   requests write access. A pull request opened with GITHUB_TOKEN wouldn't trigger CI.

name: Update instance data

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  BRANCH: automation/update-instances

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # For workload identity federation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      - name: Install dependencies
        run: uv sync --locked
      - name: Authenticate to Google Cloud
        id: gcp
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false
      - name: Scrape prices
        env:
          # The scraper uses the access token if there is one, otherwise the API key
          GCP_BILLING_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
          GCP_BILLING_API_KEY: ${{ secrets.GCP_BILLING_API_KEY }}
        run: uv run --frozen python -m skrooge.scraper scrape --output "$RUNNER_TEMP/instances.json"
      - name: Validate
        run: uv run --frozen python -m skrooge.scraper validate "$RUNNER_TEMP/instances.json"
      - name: Compare with the current data
        id: compare
        run: |
          {
            echo "Automated update of \`skrooge/instances.json\` from the [Cloud Billing Catalog API](https://cloud.google.com/billing/docs/how-to/get-pricing-information-api), by the [${GITHUB_WORKFLOW}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) workflow."
            echo
            uv run --frozen python -m skrooge.scraper diff skrooge/instances.json "$RUNNER_TEMP/instances.json"
          } > "$RUNNER_TEMP/report.md"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
          cp "$RUNNER_TEMP/instances.json" skrooge/instances.json
          if git diff --quiet -- skrooge/instances.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check the CLI works with the new data
        if: steps.compare.outputs.changed == 'true'
        run: |
          uv run --frozen pytest
          for cost_class in ondemand sud preemptible cud-1y cud-3y; do
            uv run --frozen skrooge estimate --instance n2-standard-32 --replicas 30 --cpu 2500 --mem 2024 --cost-class "$cost_class"
          done
      - name: Get auth token
        if: steps.compare.outputs.changed == 'true'
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SENTRY_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SENTRY_RELEASE_BOT_PRIVATE_KEY }}
      - name: Open or update the pull request
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
        run: |
          set -euo pipefail
          bot="${APP_SLUG}[bot]"
          bot_id="$(gh api "/users/${bot}" --jq .id)"
          git config user.name "$bot"
          git config user.email "${bot_id}+${bot}@users.noreply.github.com"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          title="chore(data): Update GCP instance prices"
          number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')"

          # Rebuild the branch from main, unless the open pull request already has this data
          if [ -n "$number" ] \
            && git fetch --quiet "$remote" "refs/heads/${BRANCH}" \
            && git diff --quiet FETCH_HEAD -- skrooge/instances.json; then
            echo "Pull request #${number} already has this data"
          else
            git switch --create "$BRANCH"
            git add skrooge/instances.json
            git commit --quiet --message "$title"
            git push --force "$remote" "HEAD:refs/heads/${BRANCH}"
          fi

          if [ -n "$number" ]; then
            gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/report.md"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/report.md"
          fi
